# 单位：位置 rad，速度 rad/s，加速度 rad/s²。
# 默认使用最大速度的 50%。
default_velocity_scaling_factor: 0.5

# 默认使用最大加速度的 20%。
default_acceleration_scaling_factor: 0.2

# 规划限位不得超过 URDF 和真机硬件安全限位。
joint_limits:
  joint1:
    has_position_limits: true
    min_position: -2.58
    max_position: 2.58
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.5

  joint2:
    # 0 rad 为常规规划下限，负向余量仅用于受控恢复。
    has_position_limits: true
    min_position: 0.0
    max_position: 3.7
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.5

  joint3:
    has_position_limits: true
    min_position: -0.01
    max_position: 3.7
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.5

  joint4:
    has_position_limits: true
    min_position: -1.57
    max_position: 1.57
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.5

  joint5:
    has_position_limits: true
    min_position: -1.57
    max_position: 1.57
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.5

  joint6:
    has_position_limits: true
    min_position: -1.57
    max_position: 1.57
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.5

  # MoveIt 模型中的夹爪关节范围。
  gripper_joint:
    has_position_limits: true
